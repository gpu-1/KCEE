name: kcee
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    environment:
      POSTGRES_DB: kcee
      POSTGRES_USER: kcee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KCEE_APP_DB_PASSWORD: ${KCEE_APP_DB_PASSWORD:?Set KCEE_APP_DB_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U kcee -d kcee"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [local]
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: kcee
      PGUSER: kcee_app
      PGPASSWORD: ${KCEE_APP_DB_PASSWORD:?Set KCEE_APP_DB_PASSWORD in .env}
      AI_URL: ${AI_URL:-http://host.docker.internal:8081}
      GEOMETRY_URL: ${GEOMETRY_URL:-http://host.docker.internal:8082}
      VOICE_URL: ${VOICE_URL:-http://host.docker.internal:8083}
      WHISPER_URL: ${WHISPER_URL:-http://host.docker.internal:8084}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
    volumes: ["./runs:/data/runs"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [local]
  viewer:
    profiles: [viewer]
    build: ./viewer
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 10
    ports: ["127.0.0.1:5173:5173"]
    networks: [local]
volumes:
  postgres:
networks:
  local:
    driver: bridge
